<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Login</title><link rel="stylesheet" href="admin.css"></head><body class="loginbody"><form id="loginForm" class="loginbox"><div class="brand">ADMIN PANEL</div><h1>Masuk Administrator</h1><p>Gunakan kredensial administrator.</p><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Masuk</button><div id="error" class="error" role="alert"></div></form><script>document.getElementById('loginForm').addEventListener('submit',async(e)=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;document.getElementById('error').textContent='';try{const r=await fetch('/api/admin-auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});if(!r.ok)throw new Error();location.replace('/admin/');}catch{document.getElementById('error').textContent='Login gagal.';}finally{b.disabled=false;}});</script></body></html>
